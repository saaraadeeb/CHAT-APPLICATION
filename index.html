<!DOCTYPE html>
<html>
    <head>
        <title>Chat App</title>
        <link rel="stylesheet"
        href="style.css">
    </head>
    <body>
        <div class="chat-container">
            <h1>Real-Time Chat App</h1>
            <ul id="messages"></ul>
            <form id="form">
                <input id="input"
                autocomplete="off" placeholder="Type message">
                <button>Send</button>
            </form>
      </div>
      <script src="/socket.io/socket.io.js"></script>
      <script src="script.js"></script>
    </body>
</html>
